name: Hero List Sync

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  sync-hero-list:
    runs-on: ubuntu-latest
    steps:
      - name: Sync hero list
        run: |
          echo "Syncing hero list at $(date -u)"
          curl -X POST -L https://rivalsdb.gg/api/admin/sync-hero-list \
            --fail --silent --show-error
          echo "Successfully synced hero list"

