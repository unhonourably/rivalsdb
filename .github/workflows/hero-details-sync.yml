name: Hero Details and Abilities Sync

on:
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

jobs:
  sync-hero-details:
    runs-on: ubuntu-latest
    steps:
      - name: Sync hero details and abilities
        run: |
          echo "Syncing hero details and abilities at $(date -u)"
          curl -X POST -L https://rivalsdb.gg/api/admin/sync-hero-details \
            --fail --silent --show-error
          echo "Successfully synced hero details and abilities"

